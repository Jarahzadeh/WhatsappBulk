services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: whatsappcrm
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  backend:
    build: ./backend
    env_file: .env.example
    environment:
      DB_URL: postgresql+psycopg://postgres:postgres@db:5432/whatsappcrm
    ports:
      - "8000:8000"
    depends_on:
      - db
  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: http://localhost:8000/api
    ports:
      - "5173:5173"
    depends_on:
      - backend
volumes:
  pgdata:
